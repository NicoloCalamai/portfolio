<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--seo-->
  <title>Pagina non trovata — Nicolò Calamai</title>
  <meta name="description" content="Portfolio di Nicolò Calamai, product e graphic designer di Bisuschio (Varese), laureato in Design alla LABA di Brescia. Prototipi in scala reale, arredo, mobilità, fanzine, t-shirt e poster automotive.">
  <meta name="robots" content="noindex">
  <!--/seo-->
  <meta name="theme-color" content="#141210">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap">
  <link rel="preload" as="image" href="assets/room.webp" imagesrcset="assets/room-1721.webp 1721w, assets/room.webp 3442w" imagesizes="100vw" media="(min-width: 821px) and (pointer: fine), (min-width: 821px) and (orientation: landscape)">
  <link rel="preload" as="image" href="assets/room-phone.webp" media="(max-width: 820px), (pointer: coarse) and (orientation: portrait)">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="room">
  <header class="topbar">
    <a class="brand" href="#/">Nicolò Calamai</a>
    <nav class="topnav">
      <div class="view-toggle" role="group" aria-label="Modalità di visualizzazione">
        <span class="view-toggle-thumb" aria-hidden="true"></span>
        <button type="button" data-set-view="room" aria-pressed="true">Stanza</button>
        <button type="button" data-set-view="list" aria-pressed="false">Overview</button>
      </div>
      <a href="/about/">About</a>
      <div class="contacts">
        <button type="button" class="contacts-toggle" aria-expanded="false" aria-controls="contacts-panel">Contatti</button>
        <div class="contacts-panel" id="contacts-panel" hidden></div>
      </div>
    </nav>
  </header>

  <main>
    <!--intro--><!--/intro-->
    <section class="room-view" aria-label="Stanza interattiva">
      <div class="room-stage">
        <!-- su telefono la stanza verticale: stessa media query di compactQuery in app.js -->
        <picture>
          <source media="(max-width: 820px), (pointer: coarse) and (orientation: portrait)" srcset="assets/room-phone.webp" width="1024" height="1536">
          <img class="room-img" src="assets/room.webp" srcset="assets/room-1721.webp 1721w, assets/room.webp 3442w" sizes="100vw" alt="La stanza di Nicolò: poster, magliette, uno sgabello e altri progetti" width="3442" height="1828">
        </picture>
        <svg class="room-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="false"></svg>
      </div>
      <div class="room-label" aria-hidden="true"><span class="room-label-kicker"></span><span class="room-label-title"></span></div>
      <p class="room-hint">Clicca sugli oggetti per esplorare la stanza</p>
    </section>

    <section class="list-view" aria-label="Overview dei progetti">
      <div class="list-half list-product">
        <h2 class="list-heading">Product Design</h2>
        <div class="list-cards" data-category="product"></div>
      </div>
      <div class="list-half list-graphic">
        <h2 class="list-heading">Graphic</h2>
        <div class="list-cards" data-category="graphic"></div>
      </div>
    </section>
  </main>

  <div class="sheet" hidden tabindex="-1" role="dialog" aria-modal="true"><!--prerender--><!--/prerender--></div>

  <div class="cover" aria-hidden="true">
    <div class="cover-inner">
      <span class="cover-name">Nicolò Calamai</span>
      <span class="cover-rule cover-rule-1"></span>
      <p class="cover-title">Portfolio</p>
      <span class="cover-rule cover-rule-2"></span>
      <span class="cover-sub">Product and Graphic Design</span>
    </div>
  </div>

  <script src="projects.js"></script>
  <script src="pages-phone.js"></script>
  <script src="app.js"></script>
</body>
</html>
